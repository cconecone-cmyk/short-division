<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>短除法動態教室</title>
<style>
:root{--bg:#081321;--panel:#162942;--inner:#0a192b;--line:#3b5575;
  --text:#f3f7ff;--muted:#b8c9df;--gold:#ffd166;--green:#62e7b3;
  --blue:#75cfff;--pink:#ff9fc7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid white;outline-offset:2px}
.app{min-height:100vh;display:flex;flex-direction:column}
.top,.setup,.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 12px}
.top,.controls{background:#192e49}
.top{border-bottom:1px solid var(--line)}
h1{font-size:clamp(18px,1.5vw,25px);margin:0 auto 0 0}
.seg{display:flex;gap:3px;padding:3px;background:#0b192c;border-radius:10px}
.seg button{border:0;border-radius:8px;padding:7px 10px;background:transparent;color:#d6e5f7;font-weight:800}
.seg button.active{background:var(--gold);color:#302000}
.view button.active{background:var(--blue);color:#08243a}
.btn{border:1px solid #607a9a;border-radius:9px;padding:7px 10px;
  background:#2b4261;color:#fff;font-weight:800}
.btn.primary{background:var(--green);color:#082a1c;border-color:var(--green)}
.btn.gold{background:var(--gold);color:#302000;border-color:var(--gold)}
.setup{background:#101f33;border-bottom:1px solid var(--line)}
input,select{border:2px solid #49617f;border-radius:8px;background:#091728;color:#fff;padding:6px}
input{width:78px;text-align:center}
input.factor-input{width:140px}
input.word-input{width:68px;text-align:center}
select{max-width:320px}
.hint{color:var(--muted);font-size:13px}
.error{color:#ffb8bf;font-weight:800}
.layout{flex:1;display:grid;grid-template-columns:minmax(300px,.9fr) minmax(400px,1.1fr);
  gap:9px;padding:9px 12px;min-height:0}
.left,.right{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 11px;border-bottom:1px solid var(--line)}
.head h2{font-size:clamp(16px,1.3vw,22px);margin:0}
.badge{background:#304967;color:#e1ecfb;border-radius:99px;padding:4px 8px;font-size:12px;font-weight:800}
.question{padding:8px 12px;font-size:clamp(16px,1.2vw,22px);font-weight:800;line-height:1.6}
.q{color:var(--blue);display:inline-block;padding:2px 8px;margin:2px 4px;background:#10253d;border:1px solid #28476d;border-radius:6px}
.short-card{display:flex;flex-direction:column;min-height:0;flex:1}
.short-wrap{display:flex;justify-content:center;align-items:center;flex:1;min-height:90px;overflow:auto;padding:8px}
.ladder{border-collapse:collapse;width:max-content;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:clamp(22px,2.3vw,40px);line-height:1.25}
.ladder td{white-space:nowrap;text-align:center;padding:.1em .75em}
.ladder .div{color:var(--gold);font-weight:900;border-right:3px solid #f0f7ff;padding:.1em .6em .1em .3em}
.ladder .line td:not(.div){border-bottom:3px solid #f0f7ff}
.ladder .yes{color:var(--green);background:#60e6b322;border-radius:4px}
.ladder .drop{color:#ffd166;background:#ffd16625;border-radius:4px}
.ladder .mark{color:var(--green)}
.ladder sup{font-size:.65em}

/* 標準分解式短除法專屬間距優化：拉開各數間距並加入細微虛線分隔，避免多個因數乘積混雜黏在一起 */
.ladder.factor-ladder td.col-num{
  padding:.2em 1.8em;
  min-width:4.8em;
}
.ladder.factor-ladder td.col-num + td.col-num{
  border-left:1px dashed rgba(255,255,255,0.18);
}

.result{background:#0b182b;border-top:1px solid var(--line);padding:7px 11px;
  font-weight:900;font-size:clamp(15px,1.1vw,21px);line-height:1.45;overflow-wrap:anywhere}
.answer{color:var(--green)}
.explain,.factor-body{padding:7px 11px;line-height:1.45;font-size:clamp(14px,1vw,18px)}
.explain strong,.selected{color:var(--gold)}
.factor-row{font-weight:800;margin:2px 0}
.factor-number{display:inline-block;color:var(--blue);min-width:3em}
sup{font-size:.7em}
.factor-answer{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;font-weight:800}
.visual-card{flex:1;display:flex;flex-direction:column;min-height:0}
.visual-info{display:flex;justify-content:space-between;align-items:center;gap:8px;
  flex-wrap:wrap;padding:7px 11px}
.visual-title{font-weight:900;font-size:clamp(16px,1.2vw,21px)}
.chip{color:var(--gold);font-weight:900;background:#ffd16616;border:1px solid #ffd16670;
  border-radius:8px;padding:4px 8px}
.canvas-wrap{flex:1;min-height:260px;padding:0 10px 7px}
canvas{display:block;width:100%;height:100%;background:var(--inner);border-radius:10px}
.visual-note{color:var(--muted);font-size:13px;padding:0 11px 7px}
.controls{justify-content:center;border-top:1px solid var(--line)}
.progress{min-width:65px;text-align:center;font-weight:800}

/* 應用問題參數組樣式 */
.param-group{display:inline-flex;align-items:center;gap:4px;background:#0d1c2d;padding:3px 8px;border-radius:6px;border:1px solid #233b58;font-size:13px;font-weight:700}

/* 對照版彈窗：加大版面與短除法字體，投影至教室後排清晰可見 */
.overlay{position:fixed;inset:0;z-index:30;background:#000e;display:none;
  align-items:center;justify-content:center;padding:12px}
.overlay.open{display:flex}
.dialog{width:min(98vw,1560px);max-height:96vh;overflow:auto;background:var(--panel);
  border:2px solid var(--line);border-radius:16px;box-shadow:0 12px 48px rgba(0,0,0,.7)}
.dialog-head{position:sticky;top:0;z-index:2;background:var(--panel);padding:10px 14px;border-bottom:1px solid var(--line)}
.dialog-body{padding:12px 16px 18px}
.compare-tools{display:flex;align-items:center;flex-wrap:wrap;gap:10px;
  padding:10px 14px;background:#0d1b2d;border-radius:10px;margin-bottom:12px}
.compare-tools label{font-weight:800}
.compare-tools select{max-width:min(100%,500px)}
.compare-question{text-align:center;font-weight:900;font-size:clamp(20px,1.8vw,28px);margin:8px 0 14px}
.compare-question .q{margin:0 6px;padding:3px 10px;background:#10253d;border:1px solid #28476d;border-radius:8px}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.compare-column{background:#0b1a2d;border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;display:flex;flex-direction:column}
.compare-column h3{margin:0 0 10px;text-align:center;font-size:clamp(22px,2.2vw,34px);font-weight:900;letter-spacing:1px}
.compare-ladder-wrap{overflow:auto;padding:16px 10px;display:flex;justify-content:safe center;align-items:center;min-height:220px;background:#06111e;border-radius:12px;margin-bottom:12px;border:1px solid #1a2f47}
.compare-ladder-wrap .ladder{font-size:clamp(32px,3.2vw,56px);line-height:1.35}
.compare-ladder-wrap .ladder td{padding:.12em 1.1em}
.compare-ladder-wrap .ladder.factor-ladder td.col-num{padding:.22em 2em;min-width:5.5em}
.compare-ladder-wrap .ladder.factor-ladder td.col-num + td.col-num{border-left:1px dashed rgba(255,255,255,0.22)}

/* 教室投影專用超大字體模式 */
.dialog.compare-zoom-huge .compare-ladder-wrap .ladder{
  font-size:clamp(40px,4.5vw,72px);
}
.dialog.compare-zoom-huge .compare-ladder-wrap{
  min-height:280px;
}

.compare-result{background:#162c47;border:1px solid #355377;padding:12px 14px;border-radius:10px;
  font-size:clamp(18px,1.5vw,26px);font-weight:900;line-height:1.6;overflow-wrap:anywhere}
.compare-note{font-size:clamp(16px,1.15vw,20px);line-height:1.6;margin:10px 0}
.compare-tip{margin-top:12px;background:#ffd16618;border-left:5px solid var(--gold);
  padding:12px 16px;line-height:1.6;font-size:clamp(15px,1.1vw,19px);border-radius:0 8px 8px 0}

body.big .app{height:100vh;height:100dvh;min-height:0}
body.big .layout{overflow:auto}
body.big .canvas-wrap{min-height:0}
body.phone .layout{display:flex;flex-direction:column;max-width:720px;width:100%;margin:auto}
body.phone h1{width:100%}
body.phone .canvas-wrap{height:390px;min-height:390px;flex:none}
body.phone .controls{position:sticky;bottom:0;z-index:10}
body.phone .ladder{font-size:clamp(20px,5vw,30px)}
@media(max-width:768px){
  .compare-grid{grid-template-columns:1fr}
  .dialog{max-height:94vh}
  .compare-tools select{width:100%;max-width:100%}
  .compare-ladder-wrap .ladder{font-size:26px}
}
@media(max-height:700px){
  body.big .top,body.big .setup,body.big .controls{padding:4px 8px}
  body.big .layout{padding:5px 8px;gap:5px}
  body.big .left{gap:5px}
  body.big .head{padding:4px 9px}
  body.big .question,body.big .explain,body.big .factor-body{padding:4px 9px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>📐 短除法動態教室 <span style="font-size:12px;color:var(--green);background:rgba(98,231,179,0.15);padding:2px 8px;border-radius:6px;font-weight:700;vertical-align:middle">v2.2 應用題動畫版</span></h1>
    <div class="seg" aria-label="教學主題">
      <button type="button" id="gcdTab">最大公因數</button>
      <button type="button" id="lcmTab">最小公倍數</button>
    </div>
    <div class="seg" aria-label="題目類型">
      <button type="button" id="integerTab">整數題</button>
      <button type="button" id="factorTab">標準分解式題</button>
      <button type="button" id="wordTab">應用問題</button>
    </div>
    <div class="seg view" aria-label="顯示版本">
      <button type="button" id="bigView">🖥 大屏</button>
      <button type="button" id="phoneView">📱 手機</button>
    </div>
    <button type="button" class="btn" id="compareBtn">📋 左右對照</button>
    <button type="button" class="btn gold" id="fullscreen">⛶ 全螢幕</button>
  </header>

  <section class="setup">
    <div id="calcSetup" style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
      <strong id="inputLabel">輸入整數</strong>
      <input id="n1" type="number" min="1" max="1000" value="12" aria-label="第一個數">
      <input id="n2" type="number" min="1" max="1000" value="18" aria-label="第二個數">
      <input id="n3" type="number" min="1" max="1000" value="30" aria-label="第三個數，可留空">
      <span id="inputHint" class="hint">2～3 個數，各為 1～1000</span>
      <button type="button" class="btn gold" id="apply">開始</button>
      <button type="button" class="btn" id="random">🎲 隨機</button>
      <label for="examples">例題</label>
      <select id="examples"></select>
      <span id="error" class="error" role="alert"></span>
    </div>

    <div id="wordSetup" style="display:none;align-items:center;gap:8px;flex-wrap:wrap">
      <strong style="color:var(--gold)">課本情境題：</strong>
      <select id="wordSelect" aria-label="選擇課本應用情境"></select>
      <div id="wordParams" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"></div>
      <button type="button" class="btn gold" id="applyWord">開始模擬</button>
      <span id="wordHint" class="hint"></span>
      <span id="wordError" class="error" role="alert"></span>
    </div>
  </section>

  <main class="layout">
    <div class="left">
      <section class="card">
        <div class="head"><h2>① 題目</h2><span id="questionBadge" class="badge"></span></div>
        <div id="question" class="question"></div>
      </section>
      <section class="card short-card">
        <div class="head"><h2>② 短除法</h2><span id="ruleBadge" class="badge"></span></div>
        <div class="short-wrap"><div id="short"></div></div>
        <div id="result" class="result" aria-live="polite"></div>
      </section>
      <section class="card">
        <div class="head"><h2>③ 目前步驟</h2><span id="stepBadge" class="badge"></span></div>
        <div id="explain" class="explain" aria-live="polite"></div>
      </section>
      <section class="card">
        <div class="head"><h2 id="section5Title">⑤ 標準分解式</h2><span id="section5Badge" class="badge">質數 × 次方</span></div>
        <div id="factorization" class="factor-body"></div>
      </section>
    </div>
    <div class="right">
      <section class="card visual-card">
        <div class="head"><h2 id="visualHeading">④ 動態圖解</h2><span id="visualBadge" class="badge"></span></div>
        <div class="visual-info"><div id="visualTitle" class="visual-title"></div><div id="visualChip" class="chip"></div></div>
        <div class="canvas-wrap" id="canvasWrap"><canvas id="canvas" aria-label="短除法動態圖解"></canvas></div>
        <div id="visualNote" class="visual-note"></div>
      </section>
    </div>
  </main>

  <nav class="controls" aria-label="播放控制">
    <button type="button" class="btn" id="reset">⟲ 重播</button>
    <button type="button" class="btn" id="prev">◀ 上一步</button>
    <span class="progress" id="progress"></span>
    <button type="button" class="btn primary" id="next">下一步 ▶</button>
    <button type="button" class="btn" id="auto">▶ 自動播放</button>
  </nav>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <div class="dialog" id="dialogModal">
    <div class="head dialog-head">
      <h2 id="dialogTitle">同一題：最大公因數 × 最小公倍數 左右對照</h2>
      <button type="button" class="btn" id="closeCompare">✕ 關閉</button>
    </div>
    <div class="dialog-body">
      <div class="compare-tools">
        <label for="compareExamples">對照例題</label>
        <select id="compareExamples" aria-label="選擇左右對照例題"></select>
        <button type="button" class="btn" id="useCurrent">帶入主畫面題目</button>
        <button type="button" class="btn gold" id="toggleZoom">🔍 投影超大字體</button>
        <span id="compareType" class="hint"></span>
      </div>
      <div id="compareQuestion" class="compare-question"></div>
      <div class="compare-grid">
        <section class="compare-column">
          <h3 style="color:#75cfff">最大公因數 (GCD)</h3>
          <div id="compareGcd"></div>
        </section>
        <section class="compare-column">
          <h3 style="color:#62e7b3">最小公倍數 (LCM)</h3>
          <div id="compareLcm"></div>
        </section>
      </div>
      <div class="compare-tip">
        <strong>💡 對照看重點：</strong>
        左側除數一律優先提出「三數皆能整除的公因數」（兩側步驟完全一致！）。
        三數無公因數時，<strong>最大公因數即停止</strong>；<strong>最小公倍數則繼續提出兩數公因數</strong>（無法整除之數直接落下）。
        最後最大公因數只乘左側；最小公倍數則是左側除數乘以最後一列。
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  function $(id){return document.getElementById(id)}
  var inputs=[$("n1"),$("n2"),$("n3")];
  var mode="gcd",questionType="integer",view=innerWidth<750?"phone":"big";
  var nums=[12,18,30],calc=null,step=0,previousStep=0,timer=null;
  var canvas=$("canvas"),ctx=null,W=0,H=0,raf=null,start=0;
  var colors=["#75cfff","#62e7b3","#ff9fc7"];
  var frames=["#ffd166","#c8a6ff","#ff8fa7","#62e7b3","#ffac69","#91b0ff","#ff8be1","#b5ef79"];
  var currentScenario="cutSquare";

  // 課本六大經典應用問題情境定義
  var wordScenarios={
    cutSquare:{
      title:"✂️ 長方形切成最大正方形",
      kind:"gcd",
      badge:"最大公因數應用",
      fields:[
        {id:"w_len",label:"長",unit:"cm",value:36,min:2,max:1000},
        {id:"w_wid",label:"寬",unit:"cm",value:24,min:2,max:1000}
      ],
      hint:"切成大小相同且面積最大的正方形（求邊長與總塊數）",
      getQuestion:function(v){
        return "一張長 <span class='q'>"+v[0]+" 公分</span>、寬 <span class='q'>"+v[1]+" 公分</span>的長方形厚紙板，想剪成大小相同且面積最大的正方形而沒有剩餘。請問：正方形邊長最大是多少公分？共可剪成幾塊？";
      },
      getExplain:function(v,ans,curStep,tot){
        var L=v[0],W=v[1],qL=Math.floor(L/ans),qW=Math.floor(W/ans),totalBlocks=qL*qW;
        if(curStep===0)return "【步驟 0：觀念分析】剪成正方形無剩餘，邊長必須同時整除長與寬；要使正方形「面積最大」，邊長就是長與寬的<strong>最大公因數</strong>。";
        if(curStep<=calc.divisors.length){
          var d=calc.divisors[curStep-1];
          var curAccum=product(calc.divisors.slice(0,curStep));
          return "【步驟 "+curStep+"：短除法分解】長與寬同除以公因數 <strong>"+d+"</strong>。目前長寬各細分切割，暫時方格尺寸為 "+curAccum+" cm。";
        }
        if(curStep===tot-1)return "【步驟 "+curStep+"：求出邊長】短除法完成！求得最大公因數 GCD("+L+", "+W+") ＝ <strong>"+ans+" 公分</strong>（即正方形邊長）。";
        return "【步驟 "+curStep+"：應用結論】<br>長可切： "+L+" ÷ "+ans+" ＝ <strong>"+qL+"</strong> 段<br>寬可切： "+W+" ÷ "+ans+" ＝ <strong>"+qW+"</strong> 段<br>共可剪成： "+qL+" × "+qW+" ＝ <strong style='color:var(--gold)'>"+totalBlocks+"</strong> 塊正方形。";
      },
      getSolution:function(v,ans){
        var L=v[0],W=v[1],qL=Math.floor(L/ans),qW=Math.floor(W/ans);
        return "<div class='factor-row'><strong>正方形邊長</strong> ＝ GCD("+L+", "+W+") ＝ <span class='answer'>"+ans+" 公分</span></div>"+
               "<div class='factor-row'><strong>裁切塊數</strong> ＝ ("+L+" ÷ "+ans+") × ("+W+" ÷ "+ans+") ＝ "+qL+" × "+qW+" ＝ <span class='answer'>"+(qL*qW)+" 塊</span></div>";
      }
    },
    plantTrees:{
      title:"🌲 長方形周圍種樹問題",
      kind:"gcd",
      badge:"最大公因數應用",
      fields:[
        {id:"w_len",label:"長",unit:"m",value:60,min:2,max:1000},
        {id:"w_wid",label:"寬",unit:"m",value:48,min:2,max:1000}
      ],
      hint:"周圍種樹且四角必種，間距最大（求樹距與總棵數）",
      getQuestion:function(v){
        return "有一塊長 <span class='q'>"+v[0]+" 公尺</span>、寬 <span class='q'>"+v[1]+" 公尺</span>的長方形池塘周圍，要在四周種樹。四個角都要種，且相鄰兩棵樹的距離均相等。請問：相鄰兩樹的最大距離是多少公尺？最少需種幾棵樹？";
      },
      getExplain:function(v,ans,curStep,tot){
        var L=v[0],W=v[1],perimeter=2*(L+W),totalTrees=Math.floor(perimeter/ans);
        if(curStep===0)return "【步驟 0：觀念分析】四角必種且距離相等，樹距必須能整除長與寬；要使種樹棵數「最少」，樹距就要「最大」，即求長與寬的<strong>最大公因數</strong>。";
        if(curStep<=calc.divisors.length){
          var d=calc.divisors[curStep-1];
          return "【步驟 "+curStep+"：短除法分解】長與寬同除以公因數 <strong>"+d+"</strong>，縮減候選間距。";
        }

  function gcd(a,b){while(b){var r=a%b;a=b;b=r}return a}
  function gcdAll(a){return a.reduce(function(x,y){return gcd(x,y)})}
  function lcmAll(a){return a.reduce(function(x,y){return x/gcd(x,y)*y})}
  function product(a){return a.reduce(function(x,y){return x*y},1)}
  function fmt(n){return n.toLocaleString("zh-TW")}
  function total(){return calc.divisors.length+2}
  function stop(){if(timer!==null){clearInterval(timer);timer=null}$("auto").textContent="▶ 自動播放"}

  function factorize(n){
    var map={},p;
    for(p=2;p*p<=n;p++)while(n%p===0){map[p]=(map[p]||0)+1;n/=p}
    if(n>1)map[n]=(map[n]||0)+1;
    return map;
  }
  function factorHTML(n){
    var map=factorize(n),keys=Object.keys(map).map(Number).sort(function(a,b){return a-b});
    if(!keys.length)return "1";
    return keys.map(function(p){return p+(map[p]>1?"<sup>"+map[p]+"</sup>":"")}).join(" × ");
  }
  function factorPlain(n){
    var map=factorize(n),keys=Object.keys(map).map(Number).sort(function(a,b){return a-b});
    return keys.length?keys.map(function(p){return p+(map[p]>1?"^"+map[p]:"")}).join("×"):"1";
  }
  function factorInput(n){return factorPlain(n).replace(/×/g,"*")}
  function show(n,type){return type==="factor"?factorHTML(n):fmt(n)}
  function isPrime(n){
    if(!Number.isInteger(n)||n<2)return false;
    for(var p=2;p*p<=n;p++)if(n%p===0)return false;
    return true;
  }
  function parseFactor(raw){
    var s=raw.replace(/\s/g,"").replace(/[×xX·]/g,"*");
    if(s==="1")return 1;
    if(!s)return null;
    var terms=s.split("*"),last=0,value=1;
    for(var i=0;i<terms.length;i++){
      var m=/^(\d+)(?:\^(\d+))?$/.exec(terms[i]);
      if(!m)return null;
      var p=Number(m[1]),e=m[2]===undefined?1:Number(m[2]);
      if(!isPrime(p)||p<=last||e<1||e>10)return null;
      last=p;value*=Math.pow(p,e);
      if(!Number.isSafeInteger(value)||value>1000)return null;
    }
    return value;
  }
  function validate(){
    var raw=inputs.map(function(x){return x.value.trim()});
    if(!raw[0]||!raw[1]){$("error").textContent="請填寫前兩個題目。";return null}
    var a=raw[2]?raw:raw.slice(0,2);
    var values=a.map(function(x){return questionType==="integer"?Number(x):parseFactor(x)});
    if(values.some(function(n){return n===null||!Number.isInteger(n)||n<1||n>1000})){
      $("error").textContent=questionType==="integer"?"請輸入 1～1000 的整數。":
        "例：2^4*3；質數由小到大、不重複，結果須為 1～1000。";
      return null;
    }
    $("error").textContent="";return values;
  }

  // 短除法核心演算法：LCM 優先提出所有數皆能整除之公因數，與 GCD 保持對照一致性
  function compute(values,kind){
    var rows=[values.slice()],ds=[];
    while(true){
      var current=rows[rows.length-1],d=0,max=Math.max.apply(null,current);
      if(kind==="gcd"){
        for(var p=2;p<=max;p++){
          if(isPrime(p)&&current.every(function(n){return n%p===0})){d=p;break;}
        }
      }else{
        // LCM 第一優先：找「全部數都能整除」的質公因數（與 GCD 同步對照）
        for(var p=2;p<=max;p++){
          if(isPrime(p)&&current.every(function(n){return n%p===0})){d=p;break;}
        }
        // LCM 第二優先：若已無三數公因數，再找「至少兩數能整除」的質數（未整除者落下）
        if(!d){
          for(var p=2;p<=max;p++){
            if(isPrime(p)&&current.filter(function(n){return n%p===0}).length>=2){d=p;break;}
          }
        }
      }
      if(!d)break;
      ds.push(d);
      rows.push(current.map(function(n){return n%d===0?n/d:n}));
    }
    return {rows:rows,divisors:ds};
  }

  function ladder(c,type,shown,finished,comparison){
    var isFactor=type==="factor";
    var html='<table class="ladder'+(isFactor?" factor-ladder":"")+'" aria-label="短除法"><tbody>';
    for(var i=0;i<shown;i++){
      var d=c.divisors[i],highlight=comparison||i===shown-1&&!finished;
      html+='<tr class="line"><td class="div">'+(isFactor?factorHTML(d):d)+"</td>";
      c.rows[i].forEach(function(n){
        var cls=highlight?(n%d===0?"yes":"drop"):"";
        html+='<td class="col-num '+cls+'">'+show(n,type)+"</td>";
      });
      html+="</tr>";
    }
    html+='<tr><td class="div"></td>';
    c.rows[shown].forEach(function(n){
      html+='<td class="col-num '+(finished?"mark":"")+'">'+show(n,type)+"</td>";
    });
    return html+"</tr></tbody></table>";
  }

  function resultHTML(values,c,kind,type){
    var d=c.divisors,last=c.rows[c.rows.length-1];
    var ans=kind==="gcd"?gcdAll(values):lcmAll(values);
    var parts=kind==="gcd"?(d.length?d.map(function(p){return type==="factor"?factorHTML(p):String(p)}):["1"]):
      d.map(function(p){return type==="factor"?factorHTML(p):String(p)}).concat(last.map(function(n){
        if(type==="factor"){
          var f=factorHTML(n);
          return f.indexOf("×")!==-1?"("+f+")":f;
        }
        return fmt(n);
      }));
    var expression=parts.join(" × ");
    var result=type==="factor"?factorHTML(ans):fmt(ans);
    return expression+' ＝ <span class="answer">'+result+"</span>";
  }

  function populateExamples(){
    var html='<option value="">選擇例題</option>';
    examples[questionType].forEach(function(e,i){html+='<option value="'+i+'">'+e.label+"</option>"});
    $("examples").innerHTML=html;
  }
  function populateCompare(){
    var html='<option value="current">目前主畫面題目</option>';

      html+='<optgroup label="'+(type==="integer"?"整數題例題":"標準分解式題例題")+'">';

  function valuesFromExample(type,index){
    return examples[type][index].values.map(function(s){return type==="integer"?Number(s):parseFactor(s)});
  }

  function compareColumn(values,type,kind){
    var c=compute(values,kind),last=c.rows[c.rows.length-1],d=c.divisors;
    var stopping=kind==="gcd"?"最後一列沒有大於 1 的共同公因數，停止。":
      "最後一列任兩數都沒有大於 1 的公因數（兩兩互質），停止。";
    var rule=kind==="gcd"?"每次所有數都能整除。":"先提出三數共同公因數；三數無公因數時，再提出兩數公因數（黃底數直接落下）。";
    var answerLabel=kind==="gcd"?"左側除數相乘":"左側除數 × 最後一列相乘";
    var factorNote=type==="factor"
      ?'<p class="compare-note">除以某個質數時，該質數的次方減 1；若原本沒有該質數，整個分解式直接落下。</p>':"";
    return '<div class="compare-ladder-wrap">'+ladder(c,type,d.length,true,true)+"</div>"+
      '<p class="compare-note"><strong>短除規則：</strong>'+rule+"<br><strong>停止條件：</strong>"+stopping+"</p>"+factorNote+
      '<div class="compare-result">'+answerLabel+"：<br>"+
      (kind==="gcd"?"最大公因數":"最小公倍數")+" ＝ "+resultHTML(values,c,kind,type)+"</div>";
  }
  function renderCompare(values,type){
    $("compareType").textContent=type==="factor"?"標準分解式表徵":"整數表徵";
    $("compareQuestion").innerHTML="題目："+values.map(function(n){
      return '<span class="q">'+show(n,type)+"</span>";
    }).join("、");
    $("compareGcd").innerHTML=compareColumn(values,type,"gcd");
    $("compareLcm").innerHTML=compareColumn(values,type,"lcm");
  }

  function apply(){
    var values=validate();if(!values)return;
    nums=values;stop();calc=compute(nums,mode);step=0;previousStep=0;render();
  }
  function setMode(m){
    if(questionType==="word"){
      for(var k in wordScenarios){
        if(wordScenarios[k].kind===m){
          currentScenario=k;$("wordSelect").value=k;
          renderWordInputs();applyWord();return;
        }
      }
    }
    var values=validate();if(!values)return;
    nums=values;mode=m;stop();calc=compute(nums,mode);step=0;previousStep=0;render();
  }

  // 應用問題專屬控制與產生邏輯
  function populateWordSelect(){
    var html="";

      var sc=wordScenarios[key];

  function renderWordInputs(){

      html+='<span class="param-group">'+f.label+'：<input id="'+f.id+'" class="word-input" type="number" min="'+f.min+'" max="'+f.max+'" value="'+f.value+'" aria-label="'+f.label+'"> '+f.unit+'</span>';
    });

  function applyWord(){
    var sc=wordScenarios[currentScenario];
    var vals=[];
    for(var i=0;i<sc.fields.length;i++){
      var f=sc.fields[i],el=$(f.id);
      if(!el){return}
      var v=Number(el.value);
      if(!Number.isInteger(v)||v<f.min||v>f.max){
        $("wordError").textContent="請輸入 "+f.min+"～"+f.max+" 的整數。";return;
      }
      vals.push(v);
    }
    $("wordError").textContent="";
    nums=vals;mode=sc.kind;stop();calc=compute(nums,mode);step=0;previousStep=0;render();

  function renderFactorization(){
    if(questionType==="word"){
      $("section5Title").textContent="⑤ 應用問題算式與結論";
      $("section5Badge").textContent="情境解題";
      var sc=wordScenarios[currentScenario];
      var ans=mode==="gcd"?gcdAll(nums):lcmAll(nums);
      var ready=step>calc.divisors.length;
      $("factorization").innerHTML=ready?sc.getSolution(nums,ans):'<div class="hint">請跟隨步驟進行短除法運算，最後步驟將自動列出生活情境算式與結論。</div>';
      return;
    }
    $("section5Title").textContent="⑤ 標準分解式";
    $("section5Badge").textContent="質數 × 次方";
    var maps=nums.map(factorize),all={},selected={};
    maps.forEach(function(m){Object.keys(m).forEach(function(p){all[p]=true})});
    Object.keys(all).forEach(function(p){
      var exps=maps.map(function(m){return m[p]||0});
      var e=mode==="gcd"?Math.min.apply(null,exps):Math.max.apply(null,exps);
      if(e>0)selected[p]=e;
    });
    var html=nums.map(function(n){
      if(questionType==="factor")return '<div class="factor-row">'+factorHTML(n)+"</div>";
      return '<div class="factor-row"><span class="factor-number">'+fmt(n)+"</span>＝ "+factorHTML(n)+"</div>";
    }).join("");
    var ready=step>calc.divisors.length;
    var answer=mode==="gcd"?gcdAll(nums):lcmAll(nums);
    html+='<div class="factor-answer">'+(mode==="gcd"?"共同質因數取最小次方":"出現過的質因數取最大次方")+"："+
      (ready?'<span class="answer">'+factorHTML(answer)+"</span>":"？")+"</div>";
    $("factorization").innerHTML=html;
  }

  function renderExplain(){
    var k=calc.divisors.length,html="";
    if(questionType==="word"){
      var sc=wordScenarios[currentScenario];
      var ans=mode==="gcd"?gcdAll(nums):lcmAll(nums);
      $("explain").innerHTML=sc.getExplain(nums,ans,step,total());
      return;
    }
    if(mode==="gcd"){
      if(step===0)html="找<strong>所有數都能整除</strong>的質數；右側每格代表 1。";
      else if(step<=k){
        var d=calc.divisors[step-1],before=product(calc.divisors.slice(0,step-1));
        html="同除以 <strong>"+d+"</strong>：將 "+d+" 個原有小組重新排列並框成大組，每組 "+(before*d)+" 格。";
      }else if(step===k+1)html="不能再全部同除；把左側除數相乘。";
      else html="用最大公因數將每個原始數量等分。";
    }else{
      if(step===0)html="保留原始長度；優先找<strong>所有數都能整除</strong>的質數，若無則找至少兩數能整除之質數。";
      else if(step<=k){
        var divisor=calc.divisors[step-1],row=calc.rows[step-1];
        var drops=row.filter(function(n){return n%divisor!==0});
        html="用 <strong>"+divisor+"</strong> 短除。"+
          (drops.length?"黃色標記無法整除，直接落下。":"本列全部可以整除。");
        if(questionType==="factor")html+="分解式中該質數的次方減 1。";
      }else if(step===k+1)html="把左側除數與最後一列相乘。";
      else html="將原始長度重複延伸，觀察共同終點。";
    }
    $("explain").innerHTML=html;
  }

    [["gcdTab",mode==="gcd"],["lcmTab",mode==="lcm"],
     ["integerTab",questionType==="integer"],["factorTab",questionType==="factor"],["wordTab",questionType==="word"]].forEach(function(a){

      $("ruleBadge").textContent=mode==="gcd"?"所有數都能除":"優先三數同除，後兩數除落下";
    }

    $("short").innerHTML=ladder(calc,questionType==="factor"?"factor":"integer",shown,step>calc.divisors.length,false);
    $("result").innerHTML=(mode==="gcd"?"最大公因數":"最小公倍數")+" ＝ "+
      (step>calc.divisors.length?resultHTML(nums,calc,mode,questionType==="factor"?"factor":"integer"):'<span class="answer">？</span>');
    
    var curBadgeText="步驟 "+step+" / "+total();
    if(questionType==="word"){
      if(step===0)curBadgeText="步驟 0: 觀念分析";
      else if(step<=calc.divisors.length)curBadgeText="步驟 "+step+": 短除第 "+step+" 步";
      else if(step===calc.divisors.length+1)curBadgeText="步驟 "+step+": 求出"+(mode==="gcd"?"最大公因數":"最小公倍數");
      else curBadgeText="步驟 "+step+": 應用算式結論";
    }
    $("stepBadge").textContent=curBadgeText;
    $("progress").textContent=step+" / "+total();

    if(questionType==="word"){
      var curSc=wordScenarios[currentScenario];
      $("visualHeading").textContent="④ "+curSc.title;
      $("visualBadge").textContent=curSc.badge;
      $("visualTitle").textContent=curSc.hint;
      var curAns=mode==="gcd"?gcdAll(nums):lcmAll(nums);
      $("visualChip").innerHTML=(mode==="gcd"?"邊長/樹距 ":"相遇/值班 ")+curAns;
      $("visualNote").textContent="請按「下一步 ▶」逐步觀察幾何分割、空間堆疊或週期循環如何與左側短除法緊密呼應！";
    }else{
      var size=product(calc.divisors.slice(0,Math.min(step,calc.divisors.length)));
      $("visualHeading").textContent=mode==="gcd"?"④ 方格動態":"④ 長度動態";
      $("visualBadge").textContent=mode==="gcd"?"重新排列 → 等分":"原始長度 → 共同倍數";
      $("visualTitle").textContent=mode==="gcd"
        ?(step===total()?"用最大公因數等分":"方格重新排列並框成組")
        :(step===total()?"原始長度重複延伸":"保留原始長度，觀察商變短");
      $("visualChip").innerHTML=mode==="gcd"?show(size,questionType)+" 格／組":
        (step===total()?"共同終點 "+show(lcmAll(nums),questionType):"固定比例尺");
      $("visualNote").textContent=mode==="gcd"?"每格代表 1；框線顯示目前分組。大數會自動縮小方格。":
        (step===total()?"共同終點使用重新縮放的比例尺；刻度過密時省略。":"淡色框保留原始長度；亮色長條表示目前的商。");
    }

    start=performance.now();
    requestAnimationFrame(function(){fitCanvas();fitShort();animate()});
  }

  function fitShort(){
    var table=$("short").querySelector(".ladder"),wrap=$("short").parentElement;
    if(!table)return;
    table.style.fontSize="";
    if(view!=="big"||!table.scrollHeight||!table.scrollWidth)return;
    var base=parseFloat(getComputedStyle(table).fontSize);
    var ratio=Math.min(1,(wrap.clientHeight-8)/table.scrollHeight,(wrap.clientWidth-8)/table.scrollWidth);
    if(ratio<1)table.style.fontSize=Math.max(12,base*ratio)+"px";
  }
  function fitCanvas(){
    if(!ctx)return;
    var r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
    W=Math.max(1,r.width);H=Math.max(1,r.height);
    var w=Math.round(W*dpr),h=Math.round(H*dpr);
    if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function drawText(str,x,y,size,color,align){
    ctx.fillStyle=color;ctx.font="700 "+size+"px sans-serif";
    ctx.textAlign=align||"left";ctx.textBaseline="middle";ctx.fillText(str,x,y);
  }

  // ================= 應用問題 Canvas 動畫逐步繪製群 =================
  function drawWord(t){
    ctx.save();
    if(currentScenario==="cutSquare")drawWordCutSquare(t);
    else if(currentScenario==="plantTrees")drawWordPlantTrees(t);
    else if(currentScenario==="cutCube")drawWordCutCube(t);
    else if(currentScenario==="buildCube")drawWordBuildCube(t);
    else if(currentScenario==="trackRun")drawWordTrackRun(t);
    else if(currentScenario==="shiftWork")drawWordShiftWork(t);
    ctx.restore();
  }

  // 1. 長方形切成最大正方形：每一步短除法，網格逐層剖分
  function drawWordCutSquare(t){
    var L=nums[0],Wd=nums[1],d=gcd(L,Wd);
    var finalNx=L/d,finalNy=Wd/d;
    var pad=40,topPad=50;
    var maxW=W-2*pad,maxH=H-pad-topPad;
    var scale=Math.min(maxW/L,maxH/Wd);
    var rectW=L*scale,rectH=Wd*scale;
    var x0=(W-rectW)/2,y0=topPad+(maxH-rectH)/2;

    // 依目前步驟計算剖分數
    var K=calc.divisors.length;
    var curDivisor=1, prevDivisor=1;
    if(step===0){curDivisor=1;}
    else if(step<=K){
      curDivisor=product(calc.divisors.slice(0,step));
      prevDivisor=product(calc.divisors.slice(0,step-1));
    }else{
      curDivisor=d;prevDivisor=d;
    }

    var stepNx=L/curDivisor, stepNy=Wd/curDivisor;
    var isFinalAnswer=step>=total()-1;

    // 標題狀態列
    drawText("長 "+L+" cm × 寬 "+Wd+" cm ｜ 步驟 "+step+"："+(step===0?"完整未切割紙板":(isFinalAnswer?"切割完成！邊長 "+d+" cm":"同除以公因數，細分網格")),pad,22,15,"#75cfff");
    var subText=isFinalAnswer?"正方形邊長 ＝ "+d+" cm ｜ 共 "+finalNx+" × "+finalNy+" ＝ "+(finalNx*finalNy)+" 塊":"目前均分單位："+curDivisor+" cm";
    drawText(subText,W-pad,22,15,isFinalAnswer?"#62e7b3":"#ffd166","right");

    // 底板長方形
    ctx.fillStyle="#10253f";ctx.fillRect(x0,y0,rectW,rectH);
    ctx.strokeStyle="#75cfff";ctx.lineWidth=2;ctx.strokeRect(x0,y0,rectW,rectH);

    // 尺寸標註
    drawText(L+" cm",x0+rectW/2,y0-14,14,"#f3f7ff","center");
    drawText(Wd+" cm",x0-14,y0+rectH/2,14,"#f3f7ff","right");

    if(step===0){
      // 步驟 0：展示虛線問號樣本
      ctx.setLineDash([4,4]);ctx.strokeStyle="#ffd166";ctx.lineWidth=2;
      var qSz=Math.min(rectW/3,rectH/2);
      ctx.strokeRect(x0,y0,qSz,qSz);
      ctx.setLineDash([]);
      drawText("? cm",x0+qSz/2,y0+qSz/2,14,"#ffd166","center");
      drawText("要剪成最大正方形...",x0+rectW/2,y0+rectH/2,16,"rgba(255,209,102,0.6)","center");
    }else{
      // 步驟 1～K+2：依目前累積除數繪製網格
      var nx=Math.round(stepNx), ny=Math.round(stepNy);
      var cellW=rectW/nx, cellH=rectH/ny;

      ctx.fillStyle="rgba(98, 231, 179, 0.14)";
      ctx.strokeStyle="rgba(255, 209, 102, 0.85)";
      ctx.lineWidth=isFinalAnswer?2:1.2;

      for(var r=0;r<ny;r++){
        for(var c=0;c<nx;c++){
          var cx=x0+c*cellW,cy=y0+r*cellH;
          if((c+r)%2===0)ctx.fillRect(cx,cy,cellW,cellH);
          ctx.strokeRect(cx,cy,cellW,cellH);
          if(isFinalAnswer && nx*ny<=64){
            var idx=r*nx+c+1;
            drawText(String(idx),cx+cellW/2,cy+cellH/2,Math.min(15,cellH*0.42),"#ffd166","center");
          }
        }
      }

      // 高亮標示目前格子的實際長寬
      ctx.strokeStyle="#ffd166";ctx.lineWidth=3;
      ctx.strokeRect(x0,y0,cellW,cellH);
      drawText((isFinalAnswer?d:curDivisor)+" cm",x0+cellW/2,y0+cellH+14,13,"#ffd166","center");
    }
  }

  // 2. 長方形池塘周圍種樹：逐步標定樹位與間距
  function drawWordPlantTrees(t){
    var L=nums[0],Wd=nums[1],d=gcd(L,Wd);
    var finalNx=L/d,finalNy=Wd/d,totalTrees=2*(finalNx+finalNy);
    var pad=50,topPad=50;
    var maxW=W-2*pad,maxH=H-pad-topPad;
    var scale=Math.min(maxW/L,maxH/Wd);
    var rectW=L*scale,rectH=Wd*scale;
    var x0=(W-rectW)/2,y0=topPad+(maxH-rectH)/2;

    var K=calc.divisors.length;
    var isDone=step>=total()-1;

    drawText("長 "+L+" m × 寬 "+Wd+" m 池塘 ｜ 周長 "+(2*(L+Wd))+" m",pad,22,15,"#75cfff");
    var subText=isDone?"最大樹距 ＝ "+d+" m ｜ 最少需種 "+totalTrees+" 棵樹":(step===0?"【步驟 0】四個頂角先定位":"【步驟 "+step+"】短除逐步求取最大樹距...");
    drawText(subText,W-pad,22,15,isDone?"#62e7b3":"#ffd166","right");

    // 池塘水面
    ctx.fillStyle="#092842";ctx.fillRect(x0,y0,rectW,rectH);
    ctx.strokeStyle="#3b6998";ctx.lineWidth=3;ctx.strokeRect(x0,y0,rectW,rectH);
    drawText("池塘水面",x0+rectW/2,y0+rectH/2,16,"rgba(117, 207, 255, 0.4)","center");

    // 收集所有樹的座標
    var pts=[];
    var curNx=isDone?finalNx:Math.max(1,Math.round(finalNx*(step/total())));
    var curNy=isDone?finalNy:Math.max(1,Math.round(finalNy*(step/total())));

    for(var c=0;c<curNx;c++)pts.push({x:x0+c*(rectW/curNx),y:y0,corner:c===0});
    for(var r=0;r<curNy;r++)pts.push({x:x0+rectW,y:y0+r*(rectH/curNy),corner:r===0});
    for(var c2=curNx;c2>0;c2--)pts.push({x:x0+c2*(rectW/curNx),y:y0+rectH,corner:c2===curNx});
    for(var r2=curNy;r2>0;r2--)pts.push({x:x0,y:y0+r2*(rectH/curNy),corner:r2===curNy});

    if(step===0){
      // 僅標記四個角落樹
      var corners=[{x:x0,y:y0},{x:x0+rectW,y:y0},{x:x0+rectW,y:y0+rectH},{x:x0,y:y0+rectH}];
      corners.forEach(function(pt){
        ctx.beginPath();ctx.arc(pt.x,pt.y,8,0,Math.PI*2);
        ctx.fillStyle="#ffd166";ctx.fill();
        ctx.strokeStyle="#081321";ctx.lineWidth=2;ctx.stroke();
      });
      drawText("★ 四角必先種 4 棵",x0+rectW/2,y0-15,13,"#ffd166","center");
    }else{
      var countToShow=isDone?pts.length:Math.max(4,Math.round(pts.length*(step/total())));
      for(var i=0;i<countToShow;i++){
        var pt=pts[i];

  // 3D 等角投影輔助函式

  // 3. 長方體切成小正方體：3D 網格逐步剖分與單元正方體抽出

      }
      for(var y=1;y<ny;y++){

      }

  // 4. 小長方體拼成大正方體：逐層堆疊
  function drawWordBuildCube(t){

    drawText("小積木 "+L+" × "+Wd+" × "+Hgt+" cm ｜ 目標拼成正方體",30,22,15,"#75cfff");
    var subText=isDone?"大正方體邊長 ＝ "+M+" cm ｜ 最少需 "+nx+"×"+ny+"×"+nz+" ＝ "+totalBlocks+" 塊積木":(step===0?"【步驟 0】單塊小長方體積木":"【步驟 "+step+"】向長寬高三維度倍增堆疊...");

    var pX00=isoProj(nx,0,0,cx,cy,s), pXY0=isoProj(nx,ny,0,cx,cy,s), p0Y0=isoProj(0,ny,0,cx,cy,s);

  // 5. 三人繞操場跑：每一步真實前進至具代表性時間點
  function drawWordTrackRun(t){
    var T1=nums[0],T2=nums[1],T3=nums[2],M=lcmAll(nums);
    var l1=M/T1,l2=M/T2,l3=M/T3;
    var cx=W/2,cy=H/2+15;
    var tw=Math.min(W-100,440),th=Math.min(H-120,200);
    var R=th/2,sw=Math.max(30,tw-2*R);

    // 依 step 決定模擬秒數目標
    var targetSec=0, phaseNote="";
    if(step===0){
      targetSec=0;
      phaseNote="【起跑準備】三人於出發線就位 (0 秒)";
    }else if(step===1){
      targetSec=T1;
      phaseNote="【經過 "+T1+" 秒】甲完成 1 圈回起點，但乙丙在其他位置！";
    }else if(step<total()-1){

    }else{

    }

    var prevSec=0;
    if(previousStep===0)prevSec=0;
    else if(previousStep===1)prevSec=T1;
    else if(previousStep<total()-1)prevSec=Math.floor(M*0.5);
    else prevSec=M;

    var curSec=prevSec+(targetSec-prevSec)*t;

    drawText("甲每圈 "+T1+"s ｜ 乙每圈 "+T2+"s ｜ 丙每圈 "+T3+"s",30,22,15,"#75cfff");
    drawText(phaseNote,W-30,22,15,(step>=total()-1)?"#62e7b3":"#ffd166","right");

    // 繪製操場跑道
    ctx.strokeStyle="#8c3e2e";ctx.lineWidth=34;ctx.lineCap="round";
    ctx.beginPath();
    ctx.moveTo(cx-sw/2,cy-R);ctx.lineTo(cx+sw/2,cy-R);

    ctx.lineTo(cx-sw/2,cy+R);

    ctx.strokeStyle="#fff";ctx.lineWidth=1.5;ctx.stroke();

    drawText("🏁 起點",cx,cy-R-26,12,"#ffd166","center");

    // 草地
    ctx.fillStyle="#1b4d3e";
    ctx.beginPath();
    ctx.moveTo(cx-sw/2,cy-R+17);ctx.lineTo(cx+sw/2,cy-R+17);
    ctx.arc(cx+sw/2,cy,R-17,-Math.PI/2,Math.PI/2);
    ctx.lineTo(cx-sw/2,cy+R-17);
    ctx.arc(cx-sw/2,cy,R-17,Math.PI/2,-Math.PI/2);
    ctx.fill();
    drawText("400m 操場",cx,cy-5,15,"rgba(255,255,255,0.4)","center");
    drawText("經過時間: "+Math.floor(curSec)+" / "+M+" 秒",cx,cy+18,14,"#ffd166","center");

    function getPos(laps,trackR){
      var frac=(laps%1+1)%1;
      var P=2*sw+2*Math.PI*trackR;
      var d=frac*P;
      var hSw=sw/2;
      if(d<hSw)return {x:cx+d,y:cy-trackR};
      if(d<hSw+Math.PI*trackR){
        var th=-Math.PI/2+(d-hSw)/trackR;

      }
      if(d<hSw+Math.PI*trackR+sw)return {x:cx+hSw-(d-(hSw+Math.PI*trackR)),y:cy+trackR};
      if(d<hSw+2*Math.PI*trackR+sw){
        var th2=Math.PI/2+(d-(hSw+Math.PI*trackR+sw))/trackR;
        return {x:cx-hSw+trackR*Math.cos(th2),y:cy+trackR*Math.sin(th2)};
      }
      return {x:cx-hSw+(d-(hSw+2*Math.PI*trackR+sw)),y:cy-trackR};
    }

    var r1=getPos(curSec/T1,R+8), r2=getPos(curSec/T2,R), r3=getPos(curSec/T3,R-8);
    var runners=[
      {pos:r1,name:"甲",laps:(curSec/T1).toFixed(1),color:"#75cfff"},
      {pos:r2,name:"乙",laps:(curSec/T2).toFixed(1),color:"#62e7b3"},
      {pos:r3,name:"丙",laps:(curSec/T3).toFixed(1),color:"#ff9fc7"}

    runners.forEach(function(r){
      ctx.beginPath();ctx.arc(r.pos.x,r.pos.y,8,0,Math.PI*2);
      ctx.fillStyle=r.color;ctx.fill();
      ctx.strokeStyle="#081321";ctx.lineWidth=2;ctx.stroke();
      drawText(r.name,r.pos.x,r.pos.y,10,"#081321","center");
    });

    drawText("甲: "+(curSec/T1).toFixed(1)+" 圈  |  乙: "+(curSec/T2).toFixed(1)+" 圈  |  丙: "+(curSec/T3).toFixed(1)+" 圈",cx,cy+th/2+32,13,"#d0e3f7","center");
  }

  // 6. 多人週期輪流值班問題：掃描時間指針逐日推進

  // ================= 經典 GCD / LCM Canvas 幾何繪圖 =================
  function geometry(n,size,w,h){
    var count=n/size,cols=Math.max(1,Math.ceil(Math.sqrt(size))),rows=Math.ceil(size/cols),best=null;
    for(var gc=1;gc<=count;gc++){
      var gr=Math.ceil(count/gc),cell=Math.min(22,w/(gc*(cols+1)),h/(gr*(rows+1)));
      if(!best||cell>best.cell)best={cell:cell,cols:cols,rows:rows,gc:gc};
    }
    return best;
  }
  function point(j,size,g,x,y){
    var group=Math.floor(j/size),within=j%size,c=g.cell;
    return {x:x+(group%g.gc)*(g.cols+1)*c+(within%g.cols)*c,
      y:y+Math.floor(group/g.gc)*(g.rows+1)*c+Math.floor(within/g.cols)*c};
  }
  function drawGcd(t){
    var k=calc.divisors.length,level=Math.min(step,k),old=Math.min(previousStep,k);
    var size=product(calc.divisors.slice(0,level)),oldSize=product(calc.divisors.slice(0,old));
    var band=H/nums.length,margin=10,header=Math.max(22,Math.min(34,band*.18));
    var w=Math.max(10,W-2*margin),h=Math.max(10,band-header-10);
    nums.forEach(function(n,i){
      var y0=i*band,font=Math.max(11,Math.min(18,band*.12));
      if(i%2){ctx.fillStyle="rgba(255,255,255,.025)";ctx.fillRect(0,y0,W,band)}
      drawText(questionType==="factor"?factorPlain(n):fmt(n)+" 格",margin,y0+header/2,font,colors[i]);
      drawText(fmt(n/size)+" 組 × "+fmt(size)+" 格",W-margin,y0+header/2,font,"#e6f1ff","right");
      var g=geometry(n,size,w,h),og=geometry(n,oldSize,w,h);
      var x=margin+(w-g.gc*(g.cols+1)*g.cell)/2;
      var ox=margin+(w-og.gc*(og.cols+1)*og.cell)/2,y=y0+header;
      var c=og.cell+(g.cell-og.cell)*t;
      for(var j=0;j<n;j++){
        var a=point(j,oldSize,og,ox,y),b=point(j,size,g,x,y),gap=Math.min(2,c*.12);
        ctx.fillStyle=colors[i];ctx.globalAlpha=.8;
        ctx.fillRect(a.x+(b.x-a.x)*t+gap/2,a.y+(b.y-a.y)*t+gap/2,Math.max(.5,c-gap),Math.max(.5,c-gap));
      }
      ctx.globalAlpha=1;
      if(size>1||step===total()){
        ctx.globalAlpha=Math.max(0,(t-.35)/.65);
        ctx.strokeStyle=step===total()?"#ffd166":frames[(level-1+frames.length)%frames.length];
        ctx.lineWidth=Math.max(1,Math.min(3,g.cell*.18));
        for(var q=0;q<n/size;q++){
          var gx=x+(q%g.gc)*(g.cols+1)*g.cell,gy=y+Math.floor(q/g.gc)*(g.rows+1)*g.cell;
          ctx.strokeRect(gx-1,gy-1,g.cols*g.cell+2,g.rows*g.cell+2);
        }
        ctx.globalAlpha=1;
      }
    });
  }
  function drawLcm(t){
    var k=calc.divisors.length,final=step===total(),band=H/nums.length;
    var left=Math.max(50,Math.min(100,W*.15)),usable=Math.max(30,W-left-Math.max(20,W*.04));
    var scale=final?lcmAll(nums):Math.max.apply(null,nums);
    var row=calc.rows[Math.min(step,k)],prev=step>0&&step<=k?calc.rows[step-1]:row;
    var font=Math.max(11,Math.min(18,band*.13));
    nums.forEach(function(n,i){
      var y0=i*band,y=y0+band*.43,bh=Math.max(12,Math.min(40,band*.25));
      if(i%2){ctx.fillStyle="rgba(255,255,255,.025)";ctx.fillRect(0,y0,W,band)}
      drawText(questionType==="factor"?factorPlain(n):fmt(n),left-8,y+bh/2,font,colors[i],"right");
      ctx.strokeStyle="#7691b0";ctx.lineWidth=1;ctx.beginPath();
      ctx.moveTo(left,y+bh+12);ctx.lineTo(left+usable,y+bh+12);ctx.stroke();
      drawText("0",left,y+bh+25,Math.max(10,font-3),"#b5c7de");
      if(!final){
        var original=usable*n/scale,current=prev[i]+(row[i]-prev[i])*t;
        ctx.fillStyle=colors[i];ctx.globalAlpha=.18;ctx.fillRect(left,y,original,bh);ctx.globalAlpha=1;
        ctx.strokeStyle=colors[i];ctx.lineWidth=2;ctx.strokeRect(left,y,original,bh);
        ctx.fillStyle=colors[i];ctx.fillRect(left,y,usable*current/scale,bh);
        var status="原始 "+(questionType==="factor"?factorPlain(n):fmt(n))+
          " ｜ 目前 "+(questionType==="factor"?factorPlain(row[i]):fmt(row[i]));
        if(step>0&&step<=k&&prev[i]===row[i])status+="（落下）";
        drawText(status,left,y0+band*.18,font,"#eef5ff");
      }else{
        var L=lcmAll(nums),count=L/n,end=usable*t;
        ctx.fillStyle=colors[i];ctx.globalAlpha=.75;ctx.fillRect(left,y,end,bh);ctx.globalAlpha=1;
        if(count<=100){
          ctx.strokeStyle="rgba(255,255,255,.75)";ctx.lineWidth=1;
          for(var j=1;j<count;j++){
            var xx=usable*j/count;if(xx>end)break;
            ctx.beginPath();ctx.moveTo(left+xx,y);ctx.lineTo(left+xx,y+bh);ctx.stroke();
          }
        }
        drawText((questionType==="factor"?factorPlain(n):fmt(n))+" × "+fmt(count)+
          " ＝ "+(questionType==="factor"?factorPlain(L):fmt(L)),left,y0+band*.18,font,"#eef5ff");
        if(t>.98){ctx.strokeStyle="#ffd166";ctx.lineWidth=3;ctx.beginPath();
          ctx.moveTo(left+usable,y-7);ctx.lineTo(left+usable,y+bh+8);ctx.stroke()}
      }
    });
  }

  function drawNow(){
    if(!ctx||!W||!H)return;
    ctx.clearRect(0,0,W,H);
    if(questionType==="word"){
      drawWord(1);
    }else{
      if(mode==="gcd")drawGcd(1);else drawLcm(1);
    }
  }

  function animate(){
    if(!ctx)return;
    if(raf!==null)cancelAnimationFrame(raf);
    function frame(now){
      var duration=(questionType==="word"&&currentScenario==="trackRun")?1800:1000;
      var raw=Math.max(0,Math.min(1,(now-start)/duration)),t=1-Math.pow(1-raw,3);
      ctx.clearRect(0,0,W,H);
      if(questionType==="word"){
        drawWord(t);
      }else{
        if(mode==="gcd")drawGcd(t);else drawLcm(t);
      }
      if(raw<1)raf=requestAnimationFrame(frame);else raf=null;
    }
    raf=requestAnimationFrame(frame);
  }

  function go(n){previousStep=step;step=Math.max(0,Math.min(total(),n));render()}
  function preset(values){
    inputs.forEach(function(input,i){input.value=values[i]||""});apply();
  }
  function fail(e){console.error(e);$("error").textContent="發生錯誤，請重新整理頁面再試。"}

  $("apply").onclick=function(){try{apply()}catch(e){fail(e)}};
  $("applyWord").onclick=function(){try{applyWord()}catch(e){fail(e)}};
  $("gcdTab").onclick=function(){try{setMode("gcd")}catch(e){fail(e)}};
  $("lcmTab").onclick=function(){try{setMode("lcm")}catch(e){fail(e)}};
  $("integerTab").onclick=function(){try{setQuestionType("integer")}catch(e){fail(e)}};
  $("factorTab").onclick=function(){try{setQuestionType("factor")}catch(e){fail(e)}};
  $("wordTab").onclick=function(){try{setQuestionType("word")}catch(e){fail(e)}};

  $("wordSelect").onchange=function(e){
    currentScenario=e.target.value;
    renderWordInputs();
    applyWord();
  };

  $("bigView").onclick=function(){setView("big")};
  $("phoneView").onclick=function(){setView("phone")};
  $("prev").onclick=function(){stop();go(step-1)};
  $("next").onclick=function(){stop();go(step+1)};
  $("reset").onclick=function(){stop();go(0)};
  $("auto").onclick=function(){
    if(timer!==null){stop();return}
    if(step===total())go(0);
    $("auto").textContent="⏸ 暫停";
    timer=setInterval(function(){if(step>=total()){stop();return}go(step+1);if(step>=total())stop()},3200);
  };
  $("examples").onchange=function(e){
    if(e.target.value!=="")preset(examples[questionType][Number(e.target.value)].values);
  };
  $("random").onclick=function(){
    var pool=examples[questionType];preset(pool[Math.floor(Math.random()*pool.length)].values);
    $("examples").value="";
  };

  $("compareBtn").onclick=function(){
    try{
      var values=nums;
      if(!values||!values.length)return;
      stop();populateCompare();$("compareExamples").value="current";
      renderCompare(values,questionType==="factor"?"factor":"integer");
      $("overlay").classList.add("open");$("closeCompare").focus();
    }catch(e){fail(e)}
  };
  $("compareExamples").onchange=function(e){
    var value=e.target.value;
    if(value==="current"){
      var current=nums;if(current)renderCompare(current,questionType==="factor"?"factor":"integer");
      return;
    }
    var parts=value.split(":"),type=parts[0],index=Number(parts[1]);
    renderCompare(valuesFromExample(type,index),type);
  };
  $("useCurrent").onclick=function(){
    var current=nums;if(!current)return;
    $("compareExamples").value="current";renderCompare(current,questionType==="factor"?"factor":"integer");
  };
  $("toggleZoom").onclick=function(){
    var isHuge=$("dialogModal").classList.toggle("compare-zoom-huge");
    $("toggleZoom").textContent=isHuge?"🔍 還原正常字體":"🔍 投影超大字體";
  };
  $("closeCompare").onclick=function(){$("overlay").classList.remove("open");$("compareBtn").focus()};
  $("overlay").onclick=function(e){if(e.target===$("overlay"))$("overlay").classList.remove("open")};

  $("fullscreen").onclick=function(){
    try{
      if(document.fullscreenElement){
        var exit=document.exitFullscreen();if(exit&&exit.catch)exit.catch(function(){});
      }else if(document.webkitFullscreenElement&&document.webkitExitFullscreen){
        document.webkitExitFullscreen();
      }else{
        setView("big");var root=document.documentElement;
        if(root.requestFullscreen){
          var request=root.requestFullscreen();
          if(request&&request.catch)request.catch(function(){alert("預覽環境可能不允許全螢幕，請在瀏覽器中直接開啟網頁。")});
        }else if(root.webkitRequestFullscreen)root.webkitRequestFullscreen();
        else alert("此瀏覽器不支援網頁全螢幕；iPhone Safari 可嘗試加入主畫面。");
      }
    }catch(e){alert("無法切換全螢幕，請在瀏覽器中直接開啟網頁後再試。")}
  };
  function fullscreenChanged(){
    $("fullscreen").textContent=(document.fullscreenElement||document.webkitFullscreenElement)?"⛶ 離開全螢幕":"⛶ 全螢幕";
    setTimeout(function(){fitCanvas();fitShort();drawNow()},100);
  }
  document.addEventListener("fullscreenchange",fullscreenChanged);
  document.addEventListener("webkitfullscreenchange",fullscreenChanged);
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&$("overlay").classList.contains("open")){$("overlay").classList.remove("open");return}
    var tag=document.activeElement&&document.activeElement.tagName;
    if(/INPUT|TEXTAREA|SELECT|BUTTON/.test(tag||"")||$("overlay").classList.contains("open"))return;
    if(e.key==="ArrowRight"){e.preventDefault();$("next").click()}
    else if(e.key==="ArrowLeft"){e.preventDefault();$("prev").click()}
    else if(e.key===" "){e.preventDefault();$("auto").click()}
  });
  window.addEventListener("resize",function(){fitCanvas();fitShort();drawNow()});

  try{
    ctx=canvas.getContext("2d");
    populateExamples();populateCompare();calc=compute(nums,mode);setView(view);render();
    if(!ctx)$("error").textContent="此瀏覽器無法顯示動畫，但計算與對照仍可使用。";
    if(window.ResizeObserver){
      var observer=new ResizeObserver(function(){fitCanvas();fitShort();drawNow()});
      observer.observe($("canvasWrap"));
    }
  }catch(e){fail(e)}
})();
</script>
</body>
</html>
