<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>短除法動態教室</title>
<style>
:root{--bg:#081321;--panel:#162942;--inner:#0a192b;--line:#3b5575;
  --text:#f3f7ff;--muted:#b8c9df;--gold:#ffd166;--green:#62e7b3;
  --blue:#75cfff;--pink:#ff9fc7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid white;outline-offset:2px}
.app{min-height:100vh;display:flex;flex-direction:column}
.top,.setup,.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:8px 12px}
.top,.controls{background:#192e49}
.top{border-bottom:1px solid var(--line)}
h1{font-size:clamp(18px,1.5vw,25px);margin:0 auto 0 0}
.seg{display:flex;gap:3px;padding:3px;background:#0b192c;border-radius:10px}
.seg button{border:0;border-radius:8px;padding:7px 10px;background:transparent;color:#d6e5f7;font-weight:800}
.seg button.active{background:var(--gold);color:#302000}
.view button.active{background:var(--blue);color:#08243a}
.btn{border:1px solid #607a9a;border-radius:9px;padding:7px 10px;
  background:#2b4261;color:#fff;font-weight:800}
.btn.primary{background:var(--green);color:#082a1c;border-color:var(--green)}
.btn.gold{background:var(--gold);color:#302000;border-color:var(--gold)}
.setup{background:#101f33;border-bottom:1px solid var(--line)}
input,select{border:2px solid #49617f;border-radius:8px;background:#091728;color:#fff;padding:6px}
input{width:72px;text-align:center}
input.factor-input{width:130px}
select{max-width:300px}
.hint{color:var(--muted);font-size:13px}
.error{color:#ffb8bf;font-weight:800}
.layout{flex:1;display:grid;grid-template-columns:minmax(300px,.9fr) minmax(400px,1.1fr);
  gap:9px;padding:9px 12px;min-height:0}
.left,.right{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 11px;border-bottom:1px solid var(--line)}
.head h2{font-size:clamp(16px,1.3vw,22px);margin:0}
.badge{background:#304967;color:#e1ecfb;border-radius:99px;padding:4px 8px;font-size:12px;font-weight:800}
.question{padding:8px 12px;font-size:clamp(16px,1.2vw,22px);font-weight:800;line-height:1.6}
.q{color:var(--blue);display:inline-block;padding:2px 8px;margin:2px 4px;background:#10253d;border:1px solid #28476d;border-radius:6px}
.short-card{display:flex;flex-direction:column;min-height:0;flex:1}
.short-wrap{display:flex;justify-content:center;align-items:center;flex:1;min-height:90px;overflow:auto;padding:8px}
.ladder{border-collapse:collapse;width:max-content;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
  font-size:clamp(22px,2.3vw,40px);line-height:1.25}
.ladder td{white-space:nowrap;text-align:center;padding:.1em .75em}
.ladder .div{color:var(--gold);font-weight:900;border-right:3px solid #f0f7ff;padding:.1em .6em .1em .3em}
.ladder .line td:not(.div){border-bottom:3px solid #f0f7ff}
.ladder .yes{color:var(--green);background:#60e6b322;border-radius:4px}
.ladder .drop{color:#ffd166;background:#ffd16625;border-radius:4px}
.ladder .mark{color:var(--green)}
.ladder sup{font-size:.65em}

/* 標準分解式短除法專屬間距優化：拉開各數間距，避免多個因數乘積混雜黏在一起 */
.ladder.factor-ladder td.col-num{
  padding:.16em 1.25em;
  min-width:4.2em;
}

.result{background:#0b182b;border-top:1px solid var(--line);padding:7px 11px;
  font-weight:900;font-size:clamp(15px,1.1vw,21px);line-height:1.45;overflow-wrap:anywhere}
.answer{color:var(--green)}
.explain,.factor-body{padding:7px 11px;line-height:1.45;font-size:clamp(14px,1vw,18px)}
.explain strong,.selected{color:var(--gold)}
.factor-row{font-weight:800;margin:2px 0}
.factor-number{display:inline-block;color:var(--blue);min-width:3em}
sup{font-size:.7em}
.factor-answer{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;font-weight:800}
.visual-card{flex:1;display:flex;flex-direction:column;min-height:0}
.visual-info{display:flex;justify-content:space-between;align-items:center;gap:8px;
  flex-wrap:wrap;padding:7px 11px}
.visual-title{font-weight:900;font-size:clamp(16px,1.2vw,21px)}
.chip{color:var(--gold);font-weight:900;background:#ffd16616;border:1px solid #ffd16670;
  border-radius:8px;padding:4px 8px}
.canvas-wrap{flex:1;min-height:260px;padding:0 10px 7px}
canvas{display:block;width:100%;height:100%;background:var(--inner);border-radius:10px}
.visual-note{color:var(--muted);font-size:13px;padding:0 11px 7px}
.controls{justify-content:center;border-top:1px solid var(--line)}
.progress{min-width:65px;text-align:center;font-weight:800}

/* 對照版彈窗：加大版面與短除法字體，投影至教室後排清晰可見 */
.overlay{position:fixed;inset:0;z-index:30;background:#000e;display:none;
  align-items:center;justify-content:center;padding:12px}
.overlay.open{display:flex}
.dialog{width:min(98vw,1560px);max-height:96vh;overflow:auto;background:var(--panel);
  border:2px solid var(--line);border-radius:16px;box-shadow:0 12px 48px rgba(0,0,0,.7)}
.dialog-head{position:sticky;top:0;z-index:2;background:var(--panel);padding:10px 14px;border-bottom:1px solid var(--line)}
.dialog-body{padding:12px 16px 18px}
.compare-tools{display:flex;align-items:center;flex-wrap:wrap;gap:10px;
  padding:10px 14px;background:#0d1b2d;border-radius:10px;margin-bottom:12px}
.compare-tools label{font-weight:800}
.compare-tools select{max-width:min(100%,500px)}
.compare-question{text-align:center;font-weight:900;font-size:clamp(20px,1.8vw,28px);margin:8px 0 14px}
.compare-question .q{margin:0 6px;padding:3px 10px;background:#10253d;border:1px solid #28476d;border-radius:8px}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.compare-column{background:#0b1a2d;border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0;display:flex;flex-direction:column}
.compare-column h3{margin:0 0 10px;text-align:center;font-size:clamp(22px,2.2vw,34px);font-weight:900;letter-spacing:1px}
.compare-ladder-wrap{overflow:auto;padding:16px 10px;display:flex;justify-content:safe center;align-items:center;min-height:220px;background:#06111e;border-radius:12px;margin-bottom:12px;border:1px solid #1a2f47}
.compare-ladder-wrap .ladder{font-size:clamp(32px,3.2vw,56px);line-height:1.35}
.compare-ladder-wrap .ladder td{padding:.12em .9em}
.compare-ladder-wrap .ladder.factor-ladder td.col-num{padding:.18em 1.4em;min-width:4.2em}

/* 教室投影專用超大字體模式 */
.dialog.compare-zoom-huge .compare-ladder-wrap .ladder{
  font-size:clamp(40px,4.5vw,72px);
}
.dialog.compare-zoom-huge .compare-ladder-wrap{
  min-height:280px;
}

.compare-result{background:#162c47;border:1px solid #355377;padding:12px 14px;border-radius:10px;
  font-size:clamp(18px,1.5vw,26px);font-weight:900;line-height:1.6;overflow-wrap:anywhere}
.compare-note{font-size:clamp(16px,1.15vw,20px);line-height:1.6;margin:10px 0}
.compare-tip{margin-top:12px;background:#ffd16618;border-left:5px solid var(--gold);
  padding:12px 16px;line-height:1.6;font-size:clamp(15px,1.1vw,19px);border-radius:0 8px 8px 0}

body.big .app{height:100vh;height:100dvh;min-height:0}
body.big .layout{overflow:auto}
body.big .canvas-wrap{min-height:0}
body.phone .layout{display:flex;flex-direction:column;max-width:720px;width:100%;margin:auto}
body.phone h1{width:100%}
body.phone .canvas-wrap{height:390px;min-height:390px;flex:none}
body.phone .controls{position:sticky;bottom:0;z-index:10}
body.phone .ladder{font-size:clamp(20px,5vw,30px)}
@media(max-width:768px){
  .compare-grid{grid-template-columns:1fr}
  .dialog{max-height:94vh}
  .compare-tools select{width:100%;max-width:100%}
  .compare-ladder-wrap .ladder{font-size:26px}
}
@media(max-height:700px){
  body.big .top,body.big .setup,body.big .controls{padding:4px 8px}
  body.big .layout{padding:5px 8px;gap:5px}
  body.big .left{gap:5px}
  body.big .head{padding:4px 9px}
  body.big .question,body.big .explain,body.big .factor-body{padding:4px 9px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>📐 短除法動態教室</h1>
    <div class="seg" aria-label="教學主題">
      <button type="button" id="gcdTab">最大公因數</button>
      <button type="button" id="lcmTab">最小公倍數</button>
    </div>
    <div class="seg" aria-label="題目類型">
      <button type="button" id="integerTab">整數題</button>
      <button type="button" id="factorTab">標準分解式題</button>
    </div>
    <div class="seg view" aria-label="顯示版本">
      <button type="button" id="bigView">🖥 大屏</button>
      <button type="button" id="phoneView">📱 手機</button>
    </div>
    <button type="button" class="btn" id="compareBtn">📋 左右對照</button>
    <button type="button" class="btn gold" id="fullscreen">⛶ 全螢幕</button>
  </header>

  <section class="setup">
    <strong id="inputLabel">輸入整數</strong>
    <input id="n1" type="number" min="1" max="500" value="12" aria-label="第一個數">
    <input id="n2" type="number" min="1" max="500" value="18" aria-label="第二個數">
    <input id="n3" type="number" min="1" max="500" value="30" aria-label="第三個數，可留空">
    <span id="inputHint" class="hint">2～3 個數，各為 1～500</span>
    <button type="button" class="btn gold" id="apply">開始</button>
    <button type="button" class="btn" id="random">🎲 隨機</button>
    <label for="examples">例題</label>
    <select id="examples"></select>
    <span id="error" class="error" role="alert"></span>
  </section>

  <main class="layout">
    <div class="left">
      <section class="card">
        <div class="head"><h2>① 題目</h2><span id="questionBadge" class="badge"></span></div>
        <div id="question" class="question"></div>
      </section>
      <section class="card short-card">
        <div class="head"><h2>② 短除法</h2><span id="ruleBadge" class="badge"></span></div>
        <div class="short-wrap"><div id="short"></div></div>
        <div id="result" class="result" aria-live="polite"></div>
      </section>
      <section class="card">
        <div class="head"><h2>③ 目前步驟</h2><span id="stepBadge" class="badge"></span></div>
        <div id="explain" class="explain" aria-live="polite"></div>
      </section>
      <section class="card">
        <div class="head"><h2>⑤ 標準分解式</h2><span class="badge">質數 × 次方</span></div>
        <div id="factorization" class="factor-body"></div>
      </section>
    </div>
    <div class="right">
      <section class="card visual-card">
        <div class="head"><h2 id="visualHeading">④ 動態圖解</h2><span id="visualBadge" class="badge"></span></div>
        <div class="visual-info"><div id="visualTitle" class="visual-title"></div><div id="visualChip" class="chip"></div></div>
        <div class="canvas-wrap" id="canvasWrap"><canvas id="canvas" aria-label="短除法動態圖解"></canvas></div>
        <div id="visualNote" class="visual-note"></div>
      </section>
    </div>
  </main>

  <nav class="controls" aria-label="播放控制">
    <button type="button" class="btn" id="reset">⟲ 重播</button>
    <button type="button" class="btn" id="prev">◀ 上一步</button>
    <span class="progress" id="progress"></span>
    <button type="button" class="btn primary" id="next">下一步 ▶</button>
    <button type="button" class="btn" id="auto">▶ 自動播放</button>
  </nav>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
  <div class="dialog" id="dialogModal">
    <div class="head dialog-head">
      <h2 id="dialogTitle">同一題：最大公因數 × 最小公倍數 左右對照</h2>
      <button type="button" class="btn" id="closeCompare">✕ 關閉</button>
    </div>
    <div class="dialog-body">
      <div class="compare-tools">
        <label for="compareExamples">對照例題</label>
        <select id="compareExamples" aria-label="選擇左右對照例題"></select>
        <button type="button" class="btn" id="useCurrent">帶入主畫面題目</button>
        <button type="button" class="btn gold" id="toggleZoom">🔍 投影超大字體</button>
        <span id="compareType" class="hint"></span>
      </div>
      <div id="compareQuestion" class="compare-question"></div>
      <div class="compare-grid">
        <section class="compare-column">
          <h3 style="color:#75cfff">最大公因數 (GCD)</h3>
          <div id="compareGcd"></div>
        </section>
        <section class="compare-column">
          <h3 style="color:#62e7b3">最小公倍數 (LCM)</h3>
          <div id="compareLcm"></div>
        </section>
      </div>
      <div class="compare-tip">
        <strong>💡 對照看重點：</strong>
        左側除數一律優先提出「三數皆能整除的公因數」（兩側步驟完全一致！）。
        三數無公因數時，<strong>最大公因數即停止</strong>；<strong>最小公倍數則繼續提出兩數公因數</strong>（無法整除之數直接落下）。
        最後最大公因數只乘左側；最小公倍數則是左側除數乘以最後一列。
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  function $(id){return document.getElementById(id)}
  var inputs=[$("n1"),$("n2"),$("n3")];
  var mode="gcd",questionType="integer",view=innerWidth<750?"phone":"big";
  var nums=[12,18,30],calc=null,step=0,previousStep=0,timer=null;
  var canvas=$("canvas"),ctx=null,W=0,H=0,raf=null,start=0;
  var colors=["#75cfff","#62e7b3","#ff9fc7"];
  var frames=["#ffd166","#c8a6ff","#ff8fa7","#62e7b3","#ffac69","#91b0ff","#ff8be1","#b5ef79"];

  // 精簡例題：各典型教學情境各保留 1 個最具代表性的例題
  var examples={
    integer:[
      {label:"12、18 ｜ 兩數基礎",values:["12","18"]},
      {label:"8、9 ｜ 兩數互質",values:["8","9"]},
      {label:"12、18、30 ｜ 三數皆有公因數",values:["12","18","30"]},
      {label:"12、18、20 ｜ 部分落下（對照經典）",values:["12","18","20"]},
      {label:"6、10、15 ｜ 兩兩有公因數（無三數共同因數）",values:["6","10","15"]},
      {label:"7、11、13 ｜ 三個質數互質",values:["7","11","13"]},
      {label:"1、12、18 ｜ 包含數字 1",values:["1","12","18"]}
    ],
    factor:[
      {label:"2²×3、2×3² ｜ 兩數基礎",values:["2^2*3","2*3^2"]},
      {label:"2³、3² ｜ 兩數互質",values:["2^3","3^2"]},
      {label:"2²×3、2×3²、2×3×5 ｜ 三數皆有公因數",values:["2^2*3","2*3^2","2*3*5"]},
      {label:"2²×3、2×3²、2²×5 ｜ 部分落下（對照經典）",values:["2^2*3","2*3^2","2^2*5"]},
      {label:"2×3、2×5、3×5 ｜ 兩兩有公因數（無三數共同因數）",values:["2*3","2*5","3*5"]},
      {label:"7、11、13 ｜ 三個質數互質",values:["7","11","13"]},
      {label:"1、2²×3、2×3² ｜ 包含數字 1",values:["1","2^2*3","2*3^2"]}
    ]
  };

  function gcd(a,b){while(b){var r=a%b;a=b;b=r}return a}
  function gcdAll(a){return a.reduce(function(x,y){return gcd(x,y)})}
  function lcmAll(a){return a.reduce(function(x,y){return x/gcd(x,y)*y})}
  function product(a){return a.reduce(function(x,y){return x*y},1)}
  function fmt(n){return n.toLocaleString("zh-TW")}
  function total(){return calc.divisors.length+2}
  function stop(){if(timer!==null){clearInterval(timer);timer=null}$("auto").textContent="▶ 自動播放"}

  function factorize(n){
    var map={},p;
    for(p=2;p*p<=n;p++)while(n%p===0){map[p]=(map[p]||0)+1;n/=p}
    if(n>1)map[n]=(map[n]||0)+1;
    return map;
  }
  function factorHTML(n){
    var map=factorize(n),keys=Object.keys(map).map(Number).sort(function(a,b){return a-b});
    if(!keys.length)return "1";
    return keys.map(function(p){return p+(map[p]>1?"<sup>"+map[p]+"</sup>":"")}).join(" × ");
  }
  function factorPlain(n){
    var map=factorize(n),keys=Object.keys(map).map(Number).sort(function(a,b){return a-b});
    return keys.length?keys.map(function(p){return p+(map[p]>1?"^"+map[p]:"")}).join("×"):"1";
  }
  function factorInput(n){return factorPlain(n).replace(/×/g,"*")}
  function show(n,type){return type==="factor"?factorHTML(n):fmt(n)}
  function isPrime(n){
    if(!Number.isInteger(n)||n<2)return false;
    for(var p=2;p*p<=n;p++)if(n%p===0)return false;
    return true;
  }
  function parseFactor(raw){
    var s=raw.replace(/\s/g,"").replace(/[×xX·]/g,"*");
    if(s==="1")return 1;
    if(!s)return null;
    var terms=s.split("*"),last=0,value=1;
    for(var i=0;i<terms.length;i++){
      var m=/^(\d+)(?:\^(\d+))?$/.exec(terms[i]);
      if(!m)return null;
      var p=Number(m[1]),e=m[2]===undefined?1:Number(m[2]);
      if(!isPrime(p)||p<=last||e<1||e>8)return null;
      last=p;value*=Math.pow(p,e);
      if(!Number.isSafeInteger(value)||value>500)return null;
    }
    return value;
  }
  function validate(){
    var raw=inputs.map(function(x){return x.value.trim()});
    if(!raw[0]||!raw[1]){$("error").textContent="請填寫前兩個題目。";return null}
    var a=raw[2]?raw:raw.slice(0,2);
    var values=a.map(function(x){return questionType==="integer"?Number(x):parseFactor(x)});
    if(values.some(function(n){return n===null||!Number.isInteger(n)||n<1||n>500})){
      $("error").textContent=questionType==="integer"?"請輸入 1～500 的整數。":
        "例：2^4*3；質數由小到大、不重複，結果須為 1～500。";
      return null;
    }
    $("error").textContent="";return values;
  }

  // 短除法核心演算法：LCM 優先提出所有數皆能整除之公因數，與 GCD 保持對照一致性
  function compute(values,kind){
    var rows=[values.slice()],ds=[];
    while(true){
      var current=rows[rows.length-1],d=0,max=Math.max.apply(null,current);
      if(kind==="gcd"){
        for(var p=2;p<=max;p++){
          if(isPrime(p)&&current.every(function(n){return n%p===0})){d=p;break;}
        }
      }else{
        // LCM 第一優先：找「全部數都能整除」的質公因數（與 GCD 同步對照）
        for(var p=2;p<=max;p++){
          if(isPrime(p)&&current.every(function(n){return n%p===0})){d=p;break;}
        }
        // LCM 第二優先：若已無三數公因數，再找「至少兩數能整除」的質數（未整除者落下）
        if(!d){
          for(var p=2;p<=max;p++){
            if(isPrime(p)&&current.filter(function(n){return n%p===0}).length>=2){d=p;break;}
          }
        }
      }
      if(!d)break;
      ds.push(d);
      rows.push(current.map(function(n){return n%d===0?n/d:n}));
    }
    return {rows:rows,divisors:ds};
  }

  function ladder(c,type,shown,finished,comparison){
    var isFactor=type==="factor";
    var html='<table class="ladder'+(isFactor?" factor-ladder":"")+'" aria-label="短除法"><tbody>';
    for(var i=0;i<shown;i++){
      var d=c.divisors[i],highlight=comparison||i===shown-1&&!finished;
      html+='<tr class="line"><td class="div">'+(isFactor?factorHTML(d):d)+"</td>";

        html+='<td class="col-num '+cls+'">'+show(n,type)+"</td>";
      });
      html+="</tr>";
    }
    html+='<tr><td class="div"></td>';
    c.rows[shown].forEach(function(n){
      html+='<td class="col-num '+(finished?"mark":"")+'">'+show(n,type)+"</td>";
    });

  }

  function resultHTML(values,c,kind,type){
    var d=c.divisors,last=c.rows[c.rows.length-1];
    var ans=kind==="gcd"?gcdAll(values):lcmAll(values);
    var parts=kind==="gcd"?(d.length?d.map(function(p){return type==="factor"?factorHTML(p):String(p)}):["1"]):
      d.map(function(p){return type==="factor"?factorHTML(p):String(p)}).concat(last.map(function(n){
        if(type==="factor"){
          var f=factorHTML(n);
          return f.indexOf("×")!==-1?"("+f+")":f;
        }
        return fmt(n);
      }));
    var expression=parts.join(" × ");
    var result=type==="factor"?factorHTML(ans):fmt(ans);
    return expression+' ＝ <span class="answer">'+result+"</span>";
  }

  function compareColumn(values,type,kind){

      '<div class="compare-result">'+answerLabel+"：<br>"+

  function renderFactorization(){

    }).join("");

  function renderExplain(){
    var k=calc.divisors.length,html="";

      if(step===0)html="保留原始長度；優先找<strong>所有數都能整除</strong>的質數，若無則找至少兩數能整除之質數。";

      }else if(step===k+1)html="把左側除數與最後一列相乘。";

  function render(){

    $("stepBadge").textContent="步驟 "+step+" / "+total();

    $("prev").disabled=step===0;$("next").disabled=step===total();
    renderExplain();renderFactorization();
    var size=product(calc.divisors.slice(0,Math.min(step,calc.divisors.length)));
    $("visualHeading").textContent=mode==="gcd"?"④ 方格動態":"④ 長度動態";
    $("visualBadge").textContent=mode==="gcd"?"重新排列 → 等分":"原始長度 → 共同倍數";

      :(step===total()?"原始長度重複延伸":"保留原始長度，觀察商變短");
    $("visualChip").innerHTML=mode==="gcd"?show(size,questionType)+" 格／組":
      (step===total()?"共同終點 "+show(lcmAll(nums),questionType):"固定比例尺");
    $("visualNote").textContent=mode==="gcd"?"每格代表 1；框線顯示目前分組。大數會自動縮小方格。":
      (step===total()?"共同終點使用重新縮放的比例尺；刻度過密時省略。":"淡色框保留原始長度；亮色長條表示目前的商。");
    start=performance.now();

  function fitShort(){
    var table=$("short").querySelector(".ladder"),wrap=$("short").parentElement;
    if(!table)return;
    table.style.fontSize="";
    if(view!=="big"||!table.scrollHeight||!table.scrollWidth)return;
    var base=parseFloat(getComputedStyle(table).fontSize);
    var ratio=Math.min(1,(wrap.clientHeight-8)/table.scrollHeight,(wrap.clientWidth-8)/table.scrollWidth);
    if(ratio<1)table.style.fontSize=Math.max(12,base*ratio)+"px";
  }
  function fitCanvas(){
    if(!ctx)return;
    var r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
    W=Math.max(1,r.width);H=Math.max(1,r.height);
    var w=Math.round(W*dpr),h=Math.round(H*dpr);
    if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function drawText(str,x,y,size,color,align){
    ctx.fillStyle=color;ctx.font="700 "+size+"px sans-serif";
    ctx.textAlign=align||"left";ctx.textBaseline="middle";ctx.fillText(str,x,y);
  }
  function geometry(n,size,w,h){
    var count=n/size,cols=Math.max(1,Math.ceil(Math.sqrt(size))),rows=Math.ceil(size/cols),best=null;
    for(var gc=1;gc<=count;gc++){
      var gr=Math.ceil(count/gc),cell=Math.min(22,w/(gc*(cols+1)),h/(gr*(rows+1)));
      if(!best||cell>best.cell)best={cell:cell,cols:cols,rows:rows,gc:gc};
    }
    return best;
  }
  function point(j,size,g,x,y){
    var group=Math.floor(j/size),within=j%size,c=g.cell;
    return {x:x+(group%g.gc)*(g.cols+1)*c+(within%g.cols)*c,
      y:y+Math.floor(group/g.gc)*(g.rows+1)*c+Math.floor(within/g.cols)*c};
  }
  function drawGcd(t){
    var k=calc.divisors.length,level=Math.min(step,k),old=Math.min(previousStep,k);
    var size=product(calc.divisors.slice(0,level)),oldSize=product(calc.divisors.slice(0,old));
    var band=H/nums.length,margin=10,header=Math.max(22,Math.min(34,band*.18));
    var w=Math.max(10,W-2*margin),h=Math.max(10,band-header-10);
    nums.forEach(function(n,i){
      var y0=i*band,font=Math.max(11,Math.min(18,band*.12));
      if(i%2){ctx.fillStyle="rgba(255,255,255,.025)";ctx.fillRect(0,y0,W,band)}
      drawText(questionType==="factor"?factorPlain(n):fmt(n)+" 格",margin,y0+header/2,font,colors[i]);
      drawText(fmt(n/size)+" 組 × "+fmt(size)+" 格",W-margin,y0+header/2,font,"#e6f1ff","right");
      var g=geometry(n,size,w,h),og=geometry(n,oldSize,w,h);
      var x=margin+(w-g.gc*(g.cols+1)*g.cell)/2;
      var ox=margin+(w-og.gc*(og.cols+1)*og.cell)/2,y=y0+header;
      var c=og.cell+(g.cell-og.cell)*t;
      for(var j=0;j<n;j++){
        var a=point(j,oldSize,og,ox,y),b=point(j,size,g,x,y),gap=Math.min(2,c*.12);
        ctx.fillStyle=colors[i];ctx.globalAlpha=.8;
        ctx.fillRect(a.x+(b.x-a.x)*t+gap/2,a.y+(b.y-a.y)*t+gap/2,Math.max(.5,c-gap),Math.max(.5,c-gap));
      }
      ctx.globalAlpha=1;
      if(size>1||step===total()){
        ctx.globalAlpha=Math.max(0,(t-.35)/.65);
        ctx.strokeStyle=step===total()?"#ffd166":frames[(level-1+frames.length)%frames.length];
        ctx.lineWidth=Math.max(1,Math.min(3,g.cell*.18));
        for(var q=0;q<n/size;q++){
          var gx=x+(q%g.gc)*(g.cols+1)*g.cell,gy=y+Math.floor(q/g.gc)*(g.rows+1)*g.cell;
          ctx.strokeRect(gx-1,gy-1,g.cols*g.cell+2,g.rows*g.cell+2);
        }
        ctx.globalAlpha=1;
      }
    });
  }
  function drawLcm(t){
    var k=calc.divisors.length,final=step===total(),band=H/nums.length;
    var left=Math.max(50,Math.min(100,W*.15)),usable=Math.max(30,W-left-Math.max(20,W*.04));
    var scale=final?lcmAll(nums):Math.max.apply(null,nums);
    var row=calc.rows[Math.min(step,k)],prev=step>0&&step<=k?calc.rows[step-1]:row;
    var font=Math.max(11,Math.min(18,band*.13));
    nums.forEach(function(n,i){
      var y0=i*band,y=y0+band*.43,bh=Math.max(12,Math.min(40,band*.25));
      if(i%2){ctx.fillStyle="rgba(255,255,255,.025)";ctx.fillRect(0,y0,W,band)}
      drawText(questionType==="factor"?factorPlain(n):fmt(n),left-8,y+bh/2,font,colors[i],"right");
      ctx.strokeStyle="#7691b0";ctx.lineWidth=1;ctx.beginPath();
      ctx.moveTo(left,y+bh+12);ctx.lineTo(left+usable,y+bh+12);ctx.stroke();
      drawText("0",left,y+bh+25,Math.max(10,font-3),"#b5c7de");
      if(!final){
        var original=usable*n/scale,current=prev[i]+(row[i]-prev[i])*t;
        ctx.fillStyle=colors[i];ctx.globalAlpha=.18;ctx.fillRect(left,y,original,bh);ctx.globalAlpha=1;
        ctx.strokeStyle=colors[i];ctx.lineWidth=2;ctx.strokeRect(left,y,original,bh);
        ctx.fillStyle=colors[i];ctx.fillRect(left,y,usable*current/scale,bh);
        var status="原始 "+(questionType==="factor"?factorPlain(n):fmt(n))+
          " ｜ 目前 "+(questionType==="factor"?factorPlain(row[i]):fmt(row[i]));
        if(step>0&&step<=k&&prev[i]===row[i])status+="（落下）";
        drawText(status,left,y0+band*.18,font,"#eef5ff");
      }else{
        var L=lcmAll(nums),count=L/n,end=usable*t;
        ctx.fillStyle=colors[i];ctx.globalAlpha=.75;ctx.fillRect(left,y,end,bh);ctx.globalAlpha=1;
        if(count<=100){
          ctx.strokeStyle="rgba(255,255,255,.75)";ctx.lineWidth=1;
          for(var j=1;j<count;j++){
            var xx=usable*j/count;if(xx>end)break;
            ctx.beginPath();ctx.moveTo(left+xx,y);ctx.lineTo(left+xx,y+bh);ctx.stroke();
          }
        }
        drawText((questionType==="factor"?factorPlain(n):fmt(n))+" × "+fmt(count)+
          " ＝ "+(questionType==="factor"?factorPlain(L):fmt(L)),left,y0+band*.18,font,"#eef5ff");
        if(t>.98){ctx.strokeStyle="#ffd166";ctx.lineWidth=3;ctx.beginPath();
          ctx.moveTo(left+usable,y-7);ctx.lineTo(left+usable,y+bh+8);ctx.stroke()}
      }
    });
  }
  function drawNow(){
    if(!ctx||!W||!H)return;
    ctx.clearRect(0,0,W,H);
    if(mode==="gcd")drawGcd(1);else drawLcm(1);

  function animate(){
    if(!ctx)return;

      var raw=Math.max(0,Math.min(1,(now-start)/1200)),t=1-Math.pow(1-raw,3);
      ctx.clearRect(0,0,W,H);
      if(mode==="gcd")drawGcd(t);else drawLcm(t);
      if(raw<1)raf=requestAnimationFrame(frame);else raf=null;
    }
    raf=requestAnimationFrame(frame);
  }
